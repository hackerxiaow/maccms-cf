<script src="/static/theme/js/jquery.min.js"></script>
<script src="/static/theme/theme.js"></script>
<script>
var curBy = 'hits';
var curTypeId = 0;

$(function () {
  Theme.init().then(function () {
    renderNav();
    bindEvents();
    loadRank();
  });
});

function renderNav() {
  API.get('/api/types').then(function (j) {
    var types = j.code === 0 ? j.data : [];
    var nav = $('#mainNav');
    nav.append('<li class="hl-nav-item hl-slide-swiper"><a href="/">首页</a></li>');
    var typeIds = (Theme.get('nav.type.PC', '1,2,3,4,5') || '').split(',').map(Number);
    types.forEach(function (t) {
      if (typeIds.indexOf(t.type_id) >= 0) {
        nav.append('<li class="hl-nav-item hl-slide-swiper"><a href="/type.html?id=' + t.type_id + '">' + U.esc(t.type_name) + '</a></li>');
      }
    });
    nav.append('<li class="hl-nav-item hl-slide-swiper"><a href="/topic.html">专题</a></li>');
    nav.append('<li class="hl-nav-item hl-slide-swiper"><a href="/art.html">资讯</a></li>');
    nav.append('<li class="hl-nav-item hl-slide-swiper"><a href="/rank.html" class="hl-text-conch active">排行</a></li>');

    // 分类维度子 Tabs
    var subTabs = $('#rankTypeTabs');
    types.forEach(function (t) {
      subTabs.append('<a class="hl-tabs-btn" href="javascript:;" data-tid="' + t.type_id + '">' + U.esc(t.type_name) + '</a>');
    });
  });
}

function bindEvents() {
  // 维度切换（总榜/月榜/周榜/评分榜）
  $('#rankTabs').on('click', 'a', function () {
    $('#rankTabs a').removeClass('active');
    $(this).addClass('active');
    curBy = $(this).data('by');
    loadRank();
  });

  // 分类子 Tabs
  $('#rankTypeTabs').on('click', 'a', function () {
    $('#rankTypeTabs a').removeClass('active');
    $(this).addClass('active');
    curTypeId = parseInt($(this).data('tid') || '0', 10);
    loadRank();
  });

  // 搜索与皮肤
  $('#btnSearch').on('click', function () {
    var kw = $('#searchInput').val().trim();
    if (kw) location.href = '/search.html?wd=' + encodeURIComponent(kw);
  });
  $('#searchInput').on('keydown', function (e) {
    if (e.key === 'Enter') $('#btnSearch').click();
  });
  $('#skinToggle').on('click', function () {
    Theme.toggleSkin();
    $('#skinText').text(Theme.get('theme.style.color', '0') === '1' ? '浅色模式' : '深色模式');
  });
}

function loadRank() {
  var list = $('#rankList');
  list.html('<li class="hl-loading" style="width:100%;">正在加载排行榜…</li>');
  var params = { by: curBy, limit: 50 };
  if (curTypeId > 0) params.type_id = curTypeId;

  API.get('/api/vod/list', params).then(function (j) {
    if (j.code !== 0 || !j.data || !j.data.list.length) {
      list.html('<li class="hl-empty" style="width:100%;">暂无榜单数据</li>');
      return;
    }
    list.html('');
    j.data.list.forEach(function (v, i) {
      list.append('<li class="hl-list-item hl-col-xs-12">' + Card.rankItem(v, i + 1) + '</li>');
    });
    Interact.lazy(list[0]);
  });
}
</script>
</body>
