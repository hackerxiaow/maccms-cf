<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>影视排行榜 - MacCMS 影视</title>
  <meta name="keywords" content="电影排行榜,电视剧排行榜,综艺排行榜,动漫排行榜,热播影视排行榜">
  <meta name="description" content="本站提供最新最全热播影视排行榜数据">
  <link rel="shortcut icon" href="/static/theme/img/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="/static/theme/css/style.css">
  <link rel="stylesheet" href="/static/theme/css/white.css" name="color">
  <link rel="stylesheet" href="/static/theme/css/swiper.min.css">
  <link rel="stylesheet" href="/static/theme/css/maccms.css">
</head>
<body class="conch-conchs">

<div id="siteHeader"></div>

<!-- 主体 (对齐 label/rank.html) -->
<div id="conch-content" class="conch-content">
  <div class="conch-ctwrap-auto">
    <div class="hl-ctwrap-item hl-conch-items">
      <div class="container">
        <div class="hl-banner-main hl-text-center clearfix" style="padding:30px 0;">
          <h1 class="hl-text-white" id="rankTitle" style="font-size:2rem;font-weight:900;margin-bottom:8px;">影视排行榜</h1>
          <span class="hl-text-white" style="opacity:0.85;">Top 50 排行榜 · 数据实时更新</span>
        </div>
      </div>
    </div>
  </div>

  <div class="conch-ctwrap hl-pa0">
    <div class="hl-ctwrap-item hl-rank-items">
      <div class="container">
        <div class="hl-row-box hl-tabs-item clearfix">
          <!-- 维度切换 Tabs：总榜 / 月榜 / 周榜 / 评分榜 -->
          <div class="hl-rb-head hl-head-page clearfix">
            <div class="hl-rb-title hl-site-tabs hl-site-tits hl-text-site" id="rankTabs">
              <a class="active" href="javascript:;" data-by="hits">总榜</a>
              <a href="javascript:;" data-by="hits_month">月榜</a>
              <a href="javascript:;" data-by="hits_week">周榜</a>
              <a href="javascript:;" data-by="score">评分榜</a>
            </div>
          </div>

          <!-- 分类维度子 Tabs -->
          <div class="hl-type-name hl-tabs-swiper hl-bg-subs hl-tabs" style="margin-bottom:14px;border-radius:6px;padding:4px 8px;">
            <div class="swiper-wrapper" id="rankTypeTabs" style="display:flex;gap:6px;overflow-x:auto;">
              <a class="hl-tabs-btn active" href="javascript:;" data-tid="0">全部</a>
            </div>
          </div>

          <!-- 50 强列表容器 -->
          <div class="hl-list-wrap">
            <ul class="hl-rank-list clearfix" id="rankList"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="siteFooter"></div>

<script src="/static/theme/js/jquery.min.js"></script>
<script src="/static/theme/theme.js"></script>
<script src="/static/theme/layout.js?v=20261021d"></script>
<script>
var curBy = 'hits';
var curTypeId = 0;

$(function () {
  Theme.init().then(function () {
    Layout.render('rank');
    loadTypes();
    bindEvents();
    loadRank();
  });
});

function loadTypes() {
  API.get('/api/types').then(function (j) {
    var types = j.code === 0 ? j.data : [];
    var subTabs = $('#rankTypeTabs');
    types.forEach(function (t) {
      subTabs.append('<a class="hl-tabs-btn" href="javascript:;" data-tid="' + t.type_id + '">' + U.esc(t.type_name) + '</a>');
    });
  });
}

function bindEvents() {
  $('#rankTabs').on('click', 'a', function () {
    $('#rankTabs a').removeClass('active');
    $(this).addClass('active');
    curBy = $(this).data('by');
    loadRank();
  });

  $('#rankTypeTabs').on('click', '.hl-tabs-btn', function () {
    $('#rankTypeTabs .hl-tabs-btn').removeClass('active');
    $(this).addClass('active');
    curTypeId = parseInt($(this).data('tid'), 10);
    loadRank();
  });
}

function loadRank() {
  var list = $('#rankList');
  list.html('<div class="hl-loading">正在载入排行榜…</div>');

  var params = { limit: 50, by: curBy, order: 'desc' };
  if (curTypeId > 0) params.type_id = curTypeId;

  API.get('/api/vod/list', params).then(function (j) {
    if (j.code !== 0 || !j.data || !j.data.list || !j.data.list.length) {
      list.html('<div class="hl-empty">暂无排行数据</div>');
      return;
    }
    list.html('');
    j.data.list.forEach(function (v, idx) {
      var rankNum = idx + 1;
      var rankCls = rankNum <= 3 ? ' hl-bg-conch' : '';
      var val = curBy === 'score' ? (v.vod_score || '9.0') : (v.vod_hits || 0);

      list.append(
        '<li class="hl-col-xs-12 hl-col-sm-6 hl-col-md-4" style="margin-bottom:12px;">' +
        '<a href="/detail.html?id=' + v.vod_id + '" class="hl-rank-item" style="display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--bg-card,#fff);border-radius:8px;border:1px solid var(--bd-color,#eee);">' +
        '<span class="hl-rank-no' + rankCls + '" style="width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;background:var(--bg-subs,#eee);color:inherit;">' + rankNum + '</span>' +
        '<div class="hl-rank-pic hl-lazy" data-original="' + U.esc(v.vod_pic || '') + '" style="width:48px;height:64px;border-radius:4px;background-size:cover;background-position:center;flex-shrink:0;"></div>' +
        '<div style="flex:1;min-width:0;">' +
        '<div class="hl-lc-1" style="font-weight:700;font-size:.95rem;">' + U.esc(v.vod_name) + '</div>' +
        '<div class="hl-lc-1" style="font-size:.8rem;color:var(--tx-mute,#888);margin-top:2px;">' + U.esc(v.vod_remarks || v.vod_actor || '') + '</div>' +
        '</div>' +
        '<span style="font-weight:700;font-size:.85rem;color:var(--hl-site,#0099ff);">' + val + (curBy === 'score' ? '分' : '次') + '</span>' +
        '</a></li>'
      );
    });
    Interact.lazy(list[0]);
  });
}
</script>
</body>
</html>
