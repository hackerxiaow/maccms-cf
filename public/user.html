<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会员中心 - MacCMS 影视</title>
  <link rel="shortcut icon" href="/static/theme/img/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="/static/theme/css/style.css">
  <link rel="stylesheet" href="/static/theme/css/white.css" name="color">
  <link rel="stylesheet" href="/static/theme/css/swiper.min.css">
  <link rel="stylesheet" href="/static/theme/css/maccms.css">
</head>
<body>

<div id="siteHeader"></div>

<div id="conch-content" class="conch-content">
  <div class="container hl-ctwrap-item" style="padding:24px 0;max-width:860px;">
    <!-- 未登录面板 (登录与注册 Tab) -->
    <div id="guestBox" class="hl-row-box" style="padding:24px;border-radius:12px;background:var(--bg-card,#fff);box-shadow:0 4px 16px rgba(0,0,0,0.06);">
      <div class="hl-rb-head clearfix" style="margin-bottom:16px;">
        <div class="hl-rb-title hl-site-tabs hl-text-site clearfix" id="authTabs">
          <a class="active" href="javascript:;" data-tab="login">会员登录</a>
          <a href="javascript:;" data-tab="register">新用户注册</a>
        </div>
      </div>

      <!-- 登录表单 -->
      <div id="tabLogin" class="auth-tab">
        <div style="margin-bottom:12px;">
          <label style="display:block;font-size:.85rem;margin-bottom:4px;">账号 / 用户名</label>
          <input type="text" id="loginUser" placeholder="请输入用户名" style="width:100%;padding:10px 14px;border:1px solid var(--bd-color,#ddd);border-radius:6px;box-sizing:border-box;">
        </div>
        <div style="margin-bottom:16px;">
          <label style="display:block;font-size:.85rem;margin-bottom:4px;">登录密码</label>
          <input type="password" id="loginPwd" placeholder="请输入密码" style="width:100%;padding:10px 14px;border:1px solid var(--bd-color,#ddd);border-radius:6px;box-sizing:border-box;">
        </div>
        <button type="button" class="hl-btn-conch hl-bg-conch" id="btnDoLogin" style="width:100%;padding:11px;font-weight:700;border:none;border-radius:6px;color:#fff;cursor:pointer;">立即登录</button>
      </div>

      <!-- 注册表单 -->
      <div id="tabRegister" class="auth-tab" style="display:none;">
        <div style="margin-bottom:12px;">
          <label style="display:block;font-size:.85rem;margin-bottom:4px;">设定用户名 (3-20位字符)</label>
          <input type="text" id="regUser" placeholder="请设置用户名" style="width:100%;padding:10px 14px;border:1px solid var(--bd-color,#ddd);border-radius:6px;box-sizing:border-box;">
        </div>
        <div style="margin-bottom:12px;">
          <label style="display:block;font-size:.85rem;margin-bottom:4px;">设定密码 (不少于6位)</label>
          <input type="password" id="regPwd" placeholder="请设置登录密码" style="width:100%;padding:10px 14px;border:1px solid var(--bd-color,#ddd);border-radius:6px;box-sizing:border-box;">
        </div>
        <div style="margin-bottom:16px;">
          <label style="display:block;font-size:.85rem;margin-bottom:4px;">个性昵称 (选填)</label>
          <input type="text" id="regNick" placeholder="热心影迷" style="width:100%;padding:10px 14px;border:1px solid var(--bd-color,#ddd);border-radius:6px;box-sizing:border-box;">
        </div>
        <button type="button" class="hl-btn-conch hl-bg-conch" id="btnDoRegister" style="width:100%;padding:11px;font-weight:700;border:none;border-radius:6px;color:#fff;cursor:pointer;">立即注册账号</button>
      </div>
    </div>

    <!-- 已登录面板 (用户信息、充值卡密、开通VIP、足迹收藏) -->
    <div id="userBox" style="display:none;">
      <!-- 用户资料横幅 -->
      <div class="hl-row-box" style="padding:24px;border-radius:12px;background:var(--bg-card,#fff);box-shadow:0 4px 16px rgba(0,0,0,0.06);margin-bottom:20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;">
        <div style="display:flex;align-items:center;gap:16px;">
          <div style="width:64px;height:64px;border-radius:50%;background:var(--hl-site,#0099ff);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:800;" id="userAvatar">U</div>
          <div>
            <h2 style="margin:0 0 4px;font-size:1.3rem;font-weight:800;" id="uNick">影迷用户</h2>
            <div style="display:flex;gap:10px;font-size:.85rem;color:var(--tx-mute,#888);">
              <span>等级：<strong style="color:var(--hl-site,#0099ff);" id="uGroup">普通会员</strong></span>
              <span>剩余积分：<strong style="color:#f59e0b;" id="uPoints">0</strong></span>
            </div>
            <div style="font-size:.8rem;color:#888;margin-top:2px;" id="uVipStatus"></div>
          </div>
        </div>
        <button type="button" id="btnLogout" style="padding:6px 16px;border:1px solid #ddd;background:none;border-radius:20px;cursor:pointer;font-size:.85rem;">退出登录</button>
      </div>

      <!-- 充值与升级板块 -->
      <div class="hl-row-box" style="padding:20px;border-radius:12px;background:var(--bg-card,#fff);box-shadow:0 4px 16px rgba(0,0,0,0.06);margin-bottom:20px;">
        <h3 style="margin:0 0 14px;font-size:1.1rem;font-weight:700;">充值卡密与开通 VIP</h3>
        <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
          <input type="text" id="cardNo" placeholder="充值卡号" style="flex:1;min-width:160px;padding:8px 12px;border:1px solid var(--bd-color,#ddd);border-radius:6px;box-sizing:border-box;">
          <input type="text" id="cardPwd" placeholder="充值卡密" style="flex:1;min-width:160px;padding:8px 12px;border:1px solid var(--bd-color,#ddd);border-radius:6px;box-sizing:border-box;">
          <button type="button" id="btnRedeem" style="padding:8px 20px;background:var(--hl-site,#0099ff);color:#fff;border:none;border-radius:6px;font-weight:700;cursor:pointer;">立即充值</button>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button type="button" class="vip-btn" data-type="day" style="padding:8px 14px;border:1px solid var(--bd-color,#eee);border-radius:6px;background:var(--bg-subs,#f8fafc);cursor:pointer;">日度 VIP (10积分)</button>
          <button type="button" class="vip-btn" data-type="week" style="padding:8px 14px;border:1px solid var(--bd-color,#eee);border-radius:6px;background:var(--bg-subs,#f8fafc);cursor:pointer;">周度 VIP (50积分)</button>
          <button type="button" class="vip-btn" data-type="month" style="padding:8px 14px;border:1px solid var(--hl-site,#0099ff);border-radius:6px;background:var(--hl-site,#0099ff);color:#fff;font-weight:700;cursor:pointer;">月度 VIP (180积分)</button>
          <button type="button" class="vip-btn" data-type="year" style="padding:8px 14px;border:1px solid var(--bd-color,#eee);border-radius:6px;background:var(--bg-subs,#f8fafc);cursor:pointer;">年度 VIP (1800积分)</button>
        </div>
      </div>

      <!-- 足迹与收藏夹 -->
      <div class="hl-row-box" style="padding:20px;border-radius:12px;background:var(--bg-card,#fff);box-shadow:0 4px 16px rgba(0,0,0,0.06);">
        <div class="hl-rb-head clearfix" style="margin-bottom:12px;">
          <div class="hl-rb-title hl-site-tabs hl-text-site clearfix" id="logTabs">
            <a class="active" href="javascript:;" data-type="history">播放历史</a>
            <a href="javascript:;" data-type="fav">我的收藏</a>
          </div>
        </div>
        <ul class="hl-one-list clearfix" id="logList"></ul>
        <div id="logEmpty" class="hl-empty" style="display:none;padding:30px 0;">暂无记录</div>
      </div>

      <div class="hl-row-box" style="padding:20px;border-radius:12px;background:var(--bg-card,#fff);box-shadow:0 4px 16px rgba(0,0,0,0.06);margin-top:20px;">
        <h3 style="margin:0 0 14px;font-size:1.05rem;">签到与优惠券</h3>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button type="button" id="btnDailySign" style="padding:8px 16px;border:0;border-radius:7px;background:var(--hl-site,#0099ff);color:#fff;cursor:pointer;">每日签到</button>
          <input type="text" id="couponCode" placeholder="输入优惠码" style="padding:8px 12px;border:1px solid var(--bd-color,#ddd);border-radius:6px;">
          <button type="button" id="btnCouponRedeem" style="padding:8px 16px;border:1px solid var(--bd-color,#ddd);border-radius:7px;background:none;cursor:pointer;">兑换优惠券</button>
        </div>
        <div id="couponList" style="margin-top:12px;font-size:.9rem;color:var(--tx-mute,#777);"></div>
      </div>

      <div class="hl-row-box" style="padding:20px;border-radius:12px;background:var(--bg-card,#fff);box-shadow:0 4px 16px rgba(0,0,0,0.06);margin-top:20px;">
        <h3 style="margin:0 0 14px;font-size:1.05rem;">积分商城</h3>
        <h4 style="margin:8px 0;">限时秒杀</h4><div id="mallSeckill" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px;"></div>
        <div id="mallGoods" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;"></div>
        <h4 style="margin:18px 0 8px;">我的商城订单</h4><div id="mallOrders" style="font-size:.9rem;color:var(--tx-mute,#777);"></div>
      </div>

      <div class="hl-row-box" style="padding:20px;border-radius:12px;background:var(--bg-card,#fff);box-shadow:0 4px 16px rgba(0,0,0,0.06);margin-top:20px;">
        <h3 style="margin:0 0 14px;font-size:1.05rem;">站内私信与关注</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
          <input type="number" id="pmReceiver" placeholder="收件会员 ID" style="padding:8px 12px;border:1px solid var(--bd-color,#ddd);border-radius:6px;">
          <input type="text" id="pmContent" placeholder="私信内容" style="flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--bd-color,#ddd);border-radius:6px;">
          <button type="button" id="btnSendPm" style="padding:8px 16px;border:1px solid var(--bd-color,#ddd);border-radius:7px;background:none;cursor:pointer;">发送私信</button>
        </div>
        <div id="pmList" style="font-size:.9rem;"></div>
        <h4 style="margin:18px 0 8px;">我的关注</h4><div id="followList" style="font-size:.9rem;color:var(--tx-mute,#777);"></div>
      </div>
    </div>
  </div>
</div>

<div id="siteFooter"></div>

<script src="/static/theme/js/jquery.min.js"></script>
<script src="/static/theme/theme.js"></script>
<script src="/static/theme/layout.js"></script>
<script>
var USER_TOKEN_KEY = 'maccms_user_token';
var token = localStorage.getItem(USER_TOKEN_KEY) || '';
var currentLogType = 'history';

$(function () {
  Theme.init().then(function () {
    Layout.render('user');
    checkAuthState();
    bindEvents();
  });
});

function checkAuthState() {
  token = localStorage.getItem(USER_TOKEN_KEY) || '';
  if (!token) {
    $('#guestBox').show();
    $('#userBox').hide();
    return;
  }

  fetch('/api/user/profile', {
    headers: { 'Authorization': 'Bearer ' + token }
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (j.code === 0 && j.data) {
      $('#guestBox').hide();
      $('#userBox').show();
      renderProfile(j.data);
      loadLogs();
      loadMemberExtras();
    } else {
      localStorage.removeItem(USER_TOKEN_KEY);
      $('#guestBox').show();
      $('#userBox').hide();
    }
  }).catch(function () {
    $('#guestBox').show();
    $('#userBox').hide();
  });
}

function renderProfile(u) {
  $('#uNick').text(u.user_nick || u.user_name);
  $('#userAvatar').text((u.user_nick || u.user_name).charAt(0).toUpperCase());
  $('#uGroup').text(u.group_name || '普通会员');
  $('#uPoints').text(u.user_points || 0);

  var now = Math.floor(Date.now() / 1000);
  if (u.user_end_time && u.user_end_time > now) {
    $('#uVipStatus').html('<span style="color:#10b981;font-weight:700;">VIP 有效期至：' + new Date(u.user_end_time * 1000).toLocaleDateString() + '</span>');
  } else {
    $('#uVipStatus').text('未开通 VIP 影视特权');
  }
}

function bindEvents() {
  $('#authTabs a').on('click', function () {
    $('#authTabs a').removeClass('active');
    $(this).addClass('active');
    var tab = $(this).data('tab');
    if (tab === 'login') {
      $('#tabLogin').show();
      $('#tabRegister').hide();
    } else {
      $('#tabLogin').hide();
      $('#tabRegister').show();
    }
  });

  $('#btnDoLogin').on('click', function () {
    var u = $('#loginUser').val().trim();
    var p = $('#loginPwd').val().trim();
    if (!u || !p) { alert('请输入账号与密码'); return; }

    API.post('/api/user/login', { username: u, password: p }).then(function (j) {
      if (j.code === 0) {
        localStorage.setItem(USER_TOKEN_KEY, j.data.token);
        checkAuthState();
      } else {
        alert(j.msg || '登录失败');
      }
    });
  });

  $('#btnDoRegister').on('click', function () {
    var u = $('#regUser').val().trim();
    var p = $('#regPwd').val().trim();
    var n = $('#regNick').val().trim();
    if (!u || !p) { alert('请输入用户名与密码'); return; }

    API.post('/api/user/register', { username: u, password: p, nick: n }).then(function (j) {
      if (j.code === 0) {
        localStorage.setItem(USER_TOKEN_KEY, j.data.token);
        alert('恭喜您注册成功！已为您自动登录并赠送初始积分。');
        checkAuthState();
      } else {
        alert(j.msg || '注册失败');
      }
    });
  });

  $('#btnLogout').on('click', function () {
    localStorage.removeItem(USER_TOKEN_KEY);
    checkAuthState();
  });

  $('#btnRedeem').on('click', function () {
    var no = $('#cardNo').val().trim();
    var pwd = $('#cardPwd').val().trim();
    if (!no || !pwd) { alert('请输入卡号与卡密'); return; }

    fetch('/api/user/redeem_card', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ card_no: no, card_pwd: pwd })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.code === 0) {
        alert(j.msg);
        $('#cardNo').val('');
        $('#cardPwd').val('');
        checkAuthState();
      } else {
        alert(j.msg || '充值失败');
      }
    });
  });

  $('.vip-btn').on('click', function () {
    var type = $(this).data('type');
    if (!confirm('确定消耗积分兑换开通此 VIP 身份吗？')) return;

    fetch('/api/user/buy_vip', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ type: type })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.code === 0) {
        alert(j.msg);
        checkAuthState();
      } else {
        alert(j.msg || '兑换失败');
      }
    });
  });

  $('#btnDailySign').on('click', function () {
    memberRequest('/api/user/sign','POST',{}).then(function(result){alert(result.msg||'签到完成');if(result.code===0)checkAuthState();});
  });

  $('#btnCouponRedeem').on('click', function () {
    var code=$('#couponCode').val().trim();if(!code){alert('请输入优惠码');return;}
    memberRequest('/api/user/coupons/redeem','POST',{code:code}).then(function(result){alert(result.msg||'兑换完成');if(result.code===0){$('#couponCode').val('');loadMemberExtras();}});
  });

  $('#btnSendPm').on('click', function () {
    var receiver=Number($('#pmReceiver').val()),content=$('#pmContent').val().trim();
    if(!receiver||!content){alert('请输入收件会员 ID 和私信内容');return;}
    memberRequest('/api/user/messages','POST',{receiver_id:receiver,content:content}).then(function(result){alert(result.msg||'发送完成');if(result.code===0){$('#pmContent').val('');loadMemberExtras();}});
  });

  $('#mallGoods').on('click','[data-buy-goods]',function(){
    var button=$(this),goodsId=Number(button.data('buy-goods'));
    var couponId=Number($('#mallCoupon_'+goodsId).val())||0;
    if(!confirm('确认创建订单？订单会扣除页面显示的积分；现金部分需管理员线下核验。待核款订单可取消并退回积分和优惠券。'))return;
    button.prop('disabled',true);
    memberRequest('/api/mall/orders','POST',{goods_id:goodsId,quantity:1,user_coupon_id:couponId}).then(function(result){alert(result.msg||'订单已创建');if(result.code===0){checkAuthState();loadMemberExtras();}}).finally(function(){button.prop('disabled',false);});
  });

  $('#mallSeckill').on('click','[data-buy-seckill]',function(){
    var button=$(this),campaignId=Number(button.data('buy-seckill')),goodsId=Number(button.data('goods-id'));
    if(!confirm('确认按秒杀价创建订单？活动库存会立即锁定，待核款订单可取消。'))return;
    button.prop('disabled',true);
    memberRequest('/api/mall/orders','POST',{goods_id:goodsId,quantity:1,seckill_id:campaignId}).then(function(result){alert(result.msg||'订单已创建');if(result.code===0){checkAuthState();loadMemberExtras();}}).finally(function(){button.prop('disabled',false);});
  });

  $('#mallOrders').on('click','[data-cancel-order]',function(){
    var button=$(this),orderId=Number(button.data('cancel-order'));
    if(!confirm('取消此待核款订单？库存、积分和优惠券会退回。'))return;
    memberRequest('/api/mall/orders/'+orderId+'/cancel','POST',{}).then(function(result){alert(result.msg||'订单已处理');if(result.code===0){checkAuthState();loadMemberExtras();}});
  });

  $('#followList').on('click','[data-unfollow]',function(){
    var button=$(this);memberRequest('/api/user/follows/toggle','POST',{mid:Number(button.data('mid')),rid:Number(button.data('rid'))}).then(function(result){if(result.code===0)loadMemberExtras();else alert(result.msg||'操作失败');});
  });

  $('#logTabs a').on('click', function () {
    $('#logTabs a').removeClass('active');
    $(this).addClass('active');
    currentLogType = $(this).data('type');
    loadLogs();
  });
}

function memberRequest(path,method,payload){
  return fetch(path,{method:method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:method==='GET'?undefined:JSON.stringify(payload||{})})
    .then(function(response){return response.json();}).catch(function(){return {code:500,msg:'请求失败，请稍后重试'};});
}

function loadMemberExtras(){
  Promise.all([
    memberRequest('/api/user/coupons','GET'),memberRequest('/api/user/messages','GET'),
    memberRequest('/api/user/follows','GET'),memberRequest('/api/mall/goods','GET'),memberRequest('/api/mall/orders','GET'),memberRequest('/api/mall/seckill','GET')
  ]).then(function(results){
    var coupons=results[0].data||[];
    var now=Math.floor(Date.now()/1000);
    var availableCoupons=coupons.filter(function(item){return !item.used_at&&!item.order_id&&(!item.starts_at||item.starts_at<=now)&&(!item.ends_at||item.ends_at>=now);});
    $('#couponList').html(coupons.length?coupons.map(function(item){var state=item.used_at?'已使用':item.order_id?'订单处理中':((item.starts_at&&item.starts_at>now)||(item.ends_at&&item.ends_at<now))?'已过期/未开始':'可使用';return '<div style="padding:6px 0;border-bottom:1px solid var(--bd-color,#eee)"><strong>'+U.esc(item.coupon_name)+'</strong> · '+U.esc(item.coupon_code)+' · '+state+'</div>';}).join(''):'尚未领取优惠券');
    var messages=results[1].data||[];
    $('#pmList').html(messages.length?messages.slice(0,20).map(function(item){return '<div style="padding:7px 0;border-bottom:1px solid var(--bd-color,#eee)"><strong>'+U.esc(item.sender_name||'会员')+'</strong> · '+U.esc(new Date(item.created_at*1000).toLocaleString())+'<div>'+U.esc(item.content)+'</div></div>';}).join(''):'暂无私信');
    var follows=results[2].data||[];
    $('#followList').html(follows.length?follows.map(function(item){return '<span style="display:inline-flex;align-items:center;gap:6px;margin:0 8px 8px 0;padding:5px 9px;border-radius:15px;background:var(--bg-subs,#f1f5f9)">模型 '+U.esc(item.follow_mid)+' · #'+item.follow_rid+' <button data-unfollow="1" data-mid="'+item.follow_mid+'" data-rid="'+item.follow_rid+'" style="border:0;background:none;color:#b45309;cursor:pointer">取消</button></span>';}).join(''):'暂无关注内容');
    var goods=results[3].data||[];
    var campaigns=results[5].data||[];
    $('#mallSeckill').html(campaigns.length?campaigns.map(function(item){return '<div style="padding:12px;border:1px solid #f4c77a;border-radius:9px;background:linear-gradient(135deg,#fffaf0,#fff)"><strong>'+U.esc(item.campaign_name)+'</strong><p style="margin:6px 0">'+U.esc(item.goods_name)+'</p><div>秒杀价 ¥ '+Number(item.sale_price||0).toFixed(2)+' · 库存 '+Number(item.inventory||0)+'</div><button type="button" data-buy-seckill="'+Number(item.campaign_id)+'" data-goods-id="'+Number(item.goods_id)+'" style="margin-top:8px;padding:6px 12px;border:0;border-radius:6px;background:#e99825;color:#fff;cursor:pointer">立即秒杀</button></div>';}).join(''):'<div class="sub">当前没有进行中的秒杀活动</div>');
    $('#mallGoods').html(goods.length?goods.map(function(item){var price=Number(item.price||0),options=availableCoupons.filter(function(coupon){return price>0&&price>=Number(coupon.min_spend||0);}).map(function(coupon){var discount=coupon.discount_type==='percent'?Number(coupon.discount_value)+'% 折扣':'减 ¥'+Number(coupon.discount_value).toFixed(2);return '<option value="'+Number(coupon.user_coupon_id)+'">'+U.esc(coupon.coupon_name)+' · '+discount+'</option>';}).join('');var couponSelect=options?'<label style="display:block;margin-top:8px;font-size:.85rem">优惠券 <select id="mallCoupon_'+Number(item.goods_id)+'" style="max-width:100%;padding:5px"><option value="">不使用</option>'+options+'</select></label>':'';return '<div style="padding:12px;border:1px solid var(--bd-color,#eee);border-radius:9px"><strong>'+U.esc(item.goods_name)+'</strong><p style="margin:6px 0;color:var(--tx-mute,#777)">'+U.esc(item.goods_desc||'')+'</p><div>积分 '+Number(item.points||0)+' · ¥ '+price.toFixed(2)+' · 库存 '+Number(item.inventory||0)+'</div>'+couponSelect+'<button type="button" data-buy-goods="'+item.goods_id+'" style="margin-top:8px;padding:6px 12px;border:0;border-radius:6px;background:var(--hl-site,#09f);color:#fff;cursor:pointer">下单</button></div>';}).join(''):'暂无上架商品');
    var orders=results[4].data||[];
    var orderStates={0:'待核款',1:'已确认/待履约',2:'已完成',3:'已取消'};
    $('#mallOrders').html(orders.length?orders.map(function(item){var cancel=Number(item.status)===0?' <button type="button" data-cancel-order="'+Number(item.mall_order_id)+'" style="margin-left:8px">取消订单</button>':'';return '<div style="padding:7px 0;border-bottom:1px solid var(--bd-color,#eee)">订单 '+U.esc(item.order_code)+' · '+U.esc(item.goods_name||'商品已下架')+' · '+(orderStates[Number(item.status)]||'未知状态')+' · ¥ '+Number(item.total_price||0).toFixed(2)+' · '+Number(item.total_points||0)+' 积分'+cancel+'</div>';}).join(''):'暂无商城订单');
  });
}

function loadLogs() {
  var url = currentLogType === 'fav' ? '/api/user/favs' : '/api/user/history';
  fetch(url, {
    headers: { 'Authorization': 'Bearer ' + token }
  }).then(function (r) { return r.json(); }).then(function (j) {
    var list = $('#logList');
    list.html('');
    if (j.code !== 0 || !j.data || !j.data.length) {
      $('#logEmpty').show();
      return;
    }
    $('#logEmpty').hide();
    j.data.forEach(function (it) {
      list.append(
        '<li class="hl-list-item hl-col-xs-6 hl-col-sm-3 hl-col-md-2" style="margin-bottom:12px;">' +
        '<a href="/play.html?id=' + it.ulog_rid + '&sid=' + it.ulog_sid + '&nid=' + it.ulog_nid + '" style="text-decoration:none;color:inherit;">' +
        '<div class="hl-lazy" data-original="' + U.esc(it.target_pic || '') + '" style="width:100%;padding-top:140%;border-radius:6px;background-size:cover;background-position:center;background-color:var(--bg-subs,#eee);"></div>' +
        '<div class="hl-lc-1" style="font-size:.9rem;font-weight:700;margin-top:6px;">' + U.esc(it.target_name || ('视频#' + it.ulog_rid)) + '</div>' +
        '</a></li>'
      );
    });
    Interact.lazy(list[0]);
  });
}
</script>
