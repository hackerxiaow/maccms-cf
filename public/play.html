<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在播放 - MacCMS 影视</title>
  <link rel="shortcut icon" href="/static/theme/img/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="/static/theme/css/style.css">
  <link rel="stylesheet" href="/static/theme/css/white.css" name="color">
  <link rel="stylesheet" href="/static/theme/css/swiper.min.css">
  <link rel="stylesheet" href="/static/theme/css/maccms.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.css">
</head>
<body>

<div id="siteHeader"></div>

<div id="conch-content" class="conch-content">
  <div class="conch-ctwrap-auto">
    <div class="container hl-paly-players">
      <div class="hl-row-box hl-ma0 clearfix">
        <!-- 播放器主栏 -->
        <div class="hl-col-xs-12 hl-col-md-70w hl-col-lg-9">
          <div class="hl-player-wrap embed-responsive embed-responsive-16by9 clearfix" id="playerWrap">
            <!-- 播放提醒 -->
            <div class="hl-player-notice hl-this-box hl-text-white" id="playerNotice">
              <a class="hl-close-this" href="javascript:;"><i class="iconfont hl-icon-cuo"></i></a>
              <span><strong><i class="hl-text-conch">提醒：</i></strong>不要轻易相信视频中的水印广告，谨防上当受骗！如果无法播放请点击切换线路或使用“报错”。</span>
            </div>

            <!-- 播放器容器 -->
            <div id="dplayer" style="width:100%;height:100%;"></div>

            <!-- 播放器快捷操作面板 -->
            <div class="hl-player-setups hl-text-white hl-tran5" id="playerSetups">
              <div class="hl-setups-wrap">
                <label style="display:inline-flex;align-items:center;gap:5px;margin:0 8px;color:#fff;font-size:.82rem;">画质 / 线路<select id="qualityChoice" aria-label="选择画质或播放线路" style="max-width:150px;padding:4px 6px;border-radius:4px;"></select></label><label style="display:inline-flex;align-items:center;gap:5px;margin:0 8px;color:#fff;font-size:.82rem;">倍速<select id="playbackSpeed" aria-label="播放倍速" style="padding:4px 6px;border-radius:4px;"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1">1.0×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2.0×</option></select></label><span id="trialCountdown" style="margin:0 8px;font-size:.82rem;"></span>
                <a href="javascript:;" id="btnRefresh"><i class="iconfont hl-icon-shuaxin"></i><span>刷新</span></a>
                <a href="javascript:;" id="btnPrev"><i class="iconfont hl-icon-shangyiji"></i><span>上一集</span></a>
                <a href="javascript:;" id="btnNext"><i class="iconfont hl-icon-xiayiji"></i><span>下一集</span></a>
                <a href="javascript:;" id="btnTheater"><i class="iconfont hl-icon-shipin"></i><span>剧场</span></a>
                <a href="javascript:;" id="btnLights"><i class="iconfont hl-icon-mingxing"></i><span>关灯</span></a>
                <a href="javascript:;" id="btnReport"><i class="iconfont hl-icon-tishi"></i><span>报错</span></a>
              </div>
              <div class="hl-setups-op"><a href="javascript:;" id="btnSetups"><i class="iconfont hl-icon-jiantouzuo"></i></a></div>
            </div>
          </div>

          <!-- 影片信息 -->
          <div class="hl-playinfo-wrap" id="playInfo">
            <div class="hl-vod-infos clearfix">
              <div class="hl-infos-head clearfix">
                <h2><span class="hl-infos-title" id="nowTitle">正在载入…</span></h2>
              </div>
              <div class="hl-infos-content clearfix">
                <div class="hl-tag-item clearfix" id="nowTags"></div>
              </div>
            </div>
          </div>

          <!-- 评论互动 -->
          <div class="hl-row-box hl-rb-comm clearfix" id="pinglun">
            <div class="hl-rb-head clearfix">
              <h3 class="hl-rb-title">边看边评</h3>
              <span class="hl-rb-more hl-text-muted">共&nbsp;<em class="hl-text-conch hl-total" id="cmtCount">0</em>&nbsp;条评论</span>
            </div>
            <div class="hl-comm-form">
              <div class="hl-comm-write">
                <input class="hl-comm-content" type="text" id="cmtName" placeholder="您的昵称（选填）" maxlength="20">
              </div>
              <div class="hl-comm-write hl-comm-start" style="margin-top:10px;">
                <textarea class="hl-comm-content" id="cmtText" placeholder="说说你对这一集的看法…"></textarea>
              </div>
              <div class="hl-comm-sub" style="margin-top:10px;text-align:right;">
                <button class="hl-btn-conch hl-bg-conch" type="button" onclick="submitComment()">发表评论</button>
              </div>
            </div>
            <div class="hl-comm-box" id="cmtList" style="margin-top:16px;"></div>
          </div>
        </div>

        <!-- 播放列表侧栏 -->
        <div class="hl-col-xs-12 hl-col-md-30w hl-col-lg-3">
          <div class="hl-row-box clearfix" id="playlistBox">
            <div class="hl-rb-head clearfix">
              <div class="hl-rb-title hl-site-tabs hl-text-site clearfix" id="sourceTabs"></div>
            </div>
            <div class="hl-tabs-wrap clearfix" id="sourceBoxes"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 视频播放故障报错弹窗 -->
<div id="reportModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:99999;align-items:center;justify-content:center;">
  <div style="background:var(--bg-card,#fff);width:90%;max-width:440px;border-radius:10px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,0.3);position:relative;">
    <h3 style="margin:0 0 14px;font-size:1.15rem;font-weight:700;">视频播放故障报错</h3>
    <div style="font-size:.9rem;color:var(--tx-mute,#888);margin-bottom:12px;" id="reportTargetInfo"></div>
    <div style="margin-bottom:12px;">
      <label style="display:block;font-size:.85rem;margin-bottom:4px;">您的称呼 (选填)</label>
      <input type="text" id="reportName" placeholder="影迷朋友" style="width:100%;padding:8px 12px;border:1px solid var(--bd-color,#ddd);border-radius:6px;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:16px;">
      <label style="display:block;font-size:.85rem;margin-bottom:4px;">故障现象描述 <span style="color:red;">*</span></label>
      <textarea id="reportContent" rows="3" placeholder="例如：黑屏无法播放 / 卡顿缓冲极慢 / 声音画面不同步…" style="width:100%;padding:8px 12px;border:1px solid var(--bd-color,#ddd);border-radius:6px;box-sizing:border-box;resize:none;"></textarea>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;">
      <button type="button" onclick="$('#reportModal').hide()" style="padding:8px 16px;border:1px solid #ccc;background:none;border-radius:6px;cursor:pointer;">取消</button>
      <button type="button" id="btnSubmitReport" style="padding:8px 20px;background:var(--hl-site,#0099ff);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:700;">提交报错</button>
    </div>
  </div>
</div>

<div id="siteFooter"></div>

<script src="/static/theme/js/jquery.min.js"></script>
<script src="/static/theme/theme.js"></script>
<script src="/static/theme/layout.js?v=20261021d"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.js"></script>
<script>
var vodId = parseInt(new URLSearchParams(location.search).get('id') || '0', 10);
var sid = parseInt(new URLSearchParams(location.search).get('sid') || '0', 10);
var nid = parseInt(new URLSearchParams(location.search).get('nid') || '0', 10);
var vod = null;
var playerCfg = {};
var playerBackupCfg = {};
var dp = null;
var serverProgress = [];
var lastProgressSync = 0;
var activeTrialKey = '';
var trialDeadline = 0;
var trialTimer = 0;
var trialFinished = false;
var playerGeneration = 0;
var fallbackInProgress = false;

$(function () {
  Theme.init().then(function () {
    Layout.render('play');
    bindGlobalEvents();
    loadPlayers();
    loadVod();
  });
});

function loadPlayers() {
  API.get('/api/players').then(function (j) {
    if (j.code === 0 && Array.isArray(j.data)) {
      j.data.forEach(function (p) {
        playerCfg[p.code.toLowerCase()] = p.parse_url;
        if (p.player_parse2) {
          playerBackupCfg[p.code.toLowerCase()] = p.player_parse2;
        }
      });
    }
  });
}

function loadVod() {
  if (!vodId) { location.href = '/'; return; }
  Promise.all([
    API.get('/api/vod/detail/' + vodId),
    API.get('/api/user/progress', { limit: 100 }).catch(function () { return { code: 401, data: [] }; })
  ]).then(function (results) {
    var j = results[0];
    if (j.code !== 0 || !j.data) { alert('影片不存在或已下架'); location.href = '/'; return; }
    serverProgress = results[1].code === 0 ? (results[1].data || []) : [];
    vod = j.data;
    var params=new URLSearchParams(location.search);
    if(!params.has('sid')){var preferredLine=Number(localStorage.getItem('maccms_last_play_line_'+vodId));if(Number.isInteger(preferredLine)&&preferredLine>=0&&preferredLine<(vod.play_groups||[]).length)sid=preferredLine;}
    document.title = '正在播放：' + vod.vod_name + ' - MacCMS 影视';
    renderInfo();
    renderSources();
    playEpisode();
    loadComments();
  });
}

function renderInfo() {
  var epName = '';
  var g = (vod.play_groups || [])[sid];
  if (g && g.urls && g.urls[nid]) epName = g.urls[nid].name;
  $('#nowTitle').html(U.esc(vod.vod_name) +
    (epName ? ' <em style="font-style:normal;font-size:.95rem;color:var(--tx-mute,#888)">&nbsp;' + U.esc(epName) + '</em>' : ''));

  var parts = [];
  var dbl = parseFloat(vod.vod_douban_score || 0);
  var tags = '';
  if (dbl > 0) tags += '<span class="hl-douban-score"><em class="db">豆</em><em class="score">' + dbl.toFixed(1) + '</em></span>';
  tags += '<a class="hl-text-conch" href="javascript:;">' + U.esc(vod.vod_remarks || '已完结') + '</a>';
  if (vod.vod_year) parts.push(U.esc(vod.vod_year));
  if (vod.vod_area) parts.push(U.esc(vod.vod_area));
  if (vod.vod_class) parts.push(U.esc(vod.vod_class));
  tags += parts.map(function (p) { return '<i>/</i><span>' + p + '</span>'; }).join('');
  $('#nowTags').html(tags);
}

function renderSources() {
  var groups = vod.play_groups || [];
  if (!groups.length) { $('#playlistBox').html('<div class="hl-empty">暂无可播放资源</div>'); return; }
  if (sid >= groups.length) sid = 0;
  renderQualityChoices();

  var tabs = $('#sourceTabs');
  var boxes = $('#sourceBoxes');
  // 关键修复：先清空原有内容，防止多次点击导致 DOM 与事件监听翻倍累加
  tabs.empty();
  boxes.empty();

  groups.forEach(function (g, gi) {
    var quality = detectQuality(g.from + ' ' + ((g.urls[nid] || {}).name || ''));
    var btn = $('<a class="hl-tabs-btn' + (gi === sid ? ' active' : '') + '"><i class="iconfont hl-icon-shipin"></i>&nbsp;' + U.esc(quality ? quality + ' · ' + g.from.toUpperCase() : g.from.toUpperCase()) + '</a>');
    btn.data('gi', gi);
    tabs.append(btn);

    var box = $('<div class="hl-tabs-box hl-fadeIn" style="display:' + (gi === sid ? 'block' : 'none') + ';">');
    var ul = $('<ul class="hl-plays-list hl-sort-list' + (g.urls.length > 8 ? ' hl-list-hide-xs' : '') + ' clearfix">');
    g.urls.forEach(function (ep, ei) {
      var cls = (gi === sid && ei === nid) ? ' class="hl-text-conch active"' : '';
      var active = (gi === sid && ei === nid) ? '<em class="hl-play-active hl-bg-conch"></em>' : '';
      ul.append('<li class="hl-col-xs-4 hl-col-sm-2"><a href="javascript:;" data-sid="' + gi + '" data-nid="' + ei + '"' + cls + '>' + active + U.esc(ep.name) + '</a></li>');
    });
    if (g.urls.length > 8) {
      ul.append('<div class="hl-show-div hl-col-xs-4 hl-col-sm-2"><a href="javascript:;" class="hl-show-list"><i class="iconfont hl-icon-jiantoushang"></i><em>展开全部</em></a></div>');
    }
    box.append(ul);
    boxes.append(box);
  });

  Interact.bindShowAll($('#playlistBox')[0]);
}

function detectQuality(value) {
  var text = String(value || '').toLowerCase();
  var match = text.match(/(?:8k|4k|2k|2160p|1440p|1080p|720p|576p|480p|360p)/i);
  if (match) return match[0].toUpperCase();
  if (text.indexOf('蓝光') >= 0) return '蓝光';
  if (text.indexOf('超清') >= 0) return '超清';
  if (text.indexOf('高清') >= 0) return '高清';
  if (text.indexOf('标清') >= 0) return '标清';
  return '';
}

function renderQualityChoices() {
  var groups = vod.play_groups || [], current = groups[sid], episode = current && current.urls ? current.urls[nid] : null;
  if (!episode) return;
  var choices = [];
  groups.forEach(function (group, index) {
    var matchIndex = group.urls.findIndex(function (item) { return String(item.name || '').trim() === String(episode.name || '').trim(); });
    if (matchIndex < 0 && group.urls[nid]) matchIndex = nid;
    if (matchIndex < 0 || !group.urls[matchIndex]) return;
    var quality = detectQuality(group.from + ' ' + group.urls[matchIndex].name);
    choices.push({ value: index + ':' + matchIndex, sid: index, nid: matchIndex, label: (quality ? quality + ' · ' : '') + (group.from || '线路 ' + (index + 1)) });
  });
  var select = $('#qualityChoice');
  select.html(choices.map(function (choice) { return '<option value="' + choice.value + '">' + U.esc(choice.label) + '</option>'; }).join(''));
  select.val(sid + ':' + nid).prop('disabled', choices.length < 2);
}

function bindGlobalEvents() {
  var tabs = $('#sourceTabs');
  var boxes = $('#sourceBoxes');

  // 事件委托只绑定一次，杜绝内存泄漏
  tabs.off('click').on('click', '.hl-tabs-btn', function () {
    var gi = $(this).data('gi');
    tabs.find('.hl-tabs-btn').removeClass('active');
    $(this).addClass('active');
    boxes.find('.hl-tabs-box').hide().eq(gi).show();
    sid = gi; nid = 0;
    renderSources();
    playEpisode();
  });

  boxes.off('click').on('click', '.hl-plays-list a[data-nid]', function () {
    nid = parseInt($(this).data('nid'), 10);
    renderSources();
    playEpisode();
  });

  $('#btnNext').on('click', playNext);
  $('#btnPrev').on('click', playPrev);
  $('#qualityChoice').on('change', function () {
    var values = String($(this).val() || '').split(':').map(Number);
    if (values.length !== 2 || !Number.isInteger(values[0]) || !Number.isInteger(values[1])) return;
    sid = values[0]; nid = values[1]; renderSources(); playEpisode();
  });
  $('#btnRefresh').on('click', function () { playEpisode(); });
  $('#btnSetups').on('click', function () { $('#playerSetups').toggleClass('active'); });
  var storedSpeed=Number(localStorage.getItem('maccms_playback_speed')||1);
  if(![0.5,0.75,1,1.25,1.5,2].includes(storedSpeed))storedSpeed=1;
  $('#playbackSpeed').val(String(storedSpeed));
  $('#playbackSpeed').on('change',function(){var rate=Number($(this).val())||1;localStorage.setItem('maccms_playback_speed',String(rate));applyPlaybackSpeed(rate);});
  $('.hl-close-this').on('click', function () { $('#playerNotice').hide(); });

  $('#btnTheater').on('click', function () {
    document.body.classList.toggle('theater-mode');
    if (document.body.classList.contains('theater-mode')) {
      $('#playerWrap').css({ height: 'calc(100vh - 40px)' });
      $('#conch-header').fadeOut();
    } else {
      $('#playerWrap').css({ height: '' });
      $('#conch-header').fadeIn();
    }
  });

  $('#btnLights').on('click', function () {
    document.body.classList.toggle('lights-off');
  });

  // 报错弹窗交互
  $('#btnReport').on('click', function () {
    var g = (vod.play_groups || [])[sid];
    var ep = g && g.urls ? g.urls[nid] : null;
    $('#reportTargetInfo').text('当前影片：' + vod.vod_name + ' | 线路：' + (g ? g.from : '') + ' | ' + (ep ? ep.name : ''));
    $('#reportModal').css('display', 'flex');
  });

  $('#btnSubmitReport').on('click', function () {
    var content = $('#reportContent').val().trim();
    if (!content) { alert('请填写故障现象描述'); return; }
    var g = (vod.play_groups || [])[sid];
    var ep = g && g.urls ? g.urls[nid] : null;

    API.post('/api/gbook/add', {
      name: $('#reportName').val().trim() || '影迷',
      content: content,
      vod_name: vod.vod_name,
      play_from: g ? g.from : '',
      play_part: ep ? ep.name : '',
    }).then(function (j) {
      if (j.code === 0) {
        alert('报错已收到，技术管理员将尽快排查修复！');
        $('#reportContent').val('');
        $('#reportModal').hide();
      } else {
        alert(j.msg || '提交失败');
      }
    });
  });
}

function playEpisode() {
  var trialKey=vodId+':'+nid;
  if(trialKey!==activeTrialKey){if(trialTimer)clearInterval(trialTimer);trialTimer=0;activeTrialKey=trialKey;trialDeadline=0;trialFinished=false;$('#trialCountdown').text('');}
  localStorage.setItem('maccms_last_play_line_'+vodId,String(sid));
  var group = (vod.play_groups || [])[sid];
  if (!group || !group.urls[nid]) return;
  var ep = group.urls[nid];
  var from = (ep.from || group.from || 'dplayer').toLowerCase();
  var parse = playerCfg[from] || '';
  var parse2 = playerBackupCfg[from] || '';

  history.replaceState(null, '', '/play.html?id=' + vodId + '&sid=' + sid + '&nid=' + nid);
  $('#nowTitle').html(U.esc(vod.vod_name) + ' <em style="font-style:normal;font-size:.95rem;color:var(--tx-mute,#888)">' + U.esc(ep.name) + '</em>');

  // 点播鉴权检查
  API.post('/api/vod/check_play', { vod_id: vodId, nid: nid + 1 }).then(function (ck) {
    if (ck.code !== 0 && ck.data && !ck.data.canPlay) {
      destroyPlayer();
      $('#dplayer').html(
        '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111;color:#fff;padding:20px;text-align:center;">' +
        '<i class="iconfont hl-icon-suo" style="font-size:3rem;color:var(--hl-site,#0099ff);margin-bottom:12px;"></i>' +
        '<h3 style="margin:0 0 8px;">观看权限提示</h3>' +
        '<p style="color:#aaa;max-width:360px;">' + U.esc(ck.data.reason || '当前视频需要权限') + '</p>' +
        '<div style="margin-top:16px;"><a href="/user.html" style="padding:8px 24px;background:var(--hl-site,#0099ff);color:#fff;border-radius:20px;font-weight:700;">前往会员中心充值/开通VIP</a></div>' +
        '</div>'
      );
      return;
    }

    var resolveEpisode = function (password) {
      return API.post('/api/vod/resolve', { vod_id: vodId, sid: sid, nid: nid, mode: 'play', password: password || '' });
    };
    resolveEpisode('').then(function (resolved) {
      if (resolved.code !== 0 && resolved.data && resolved.data.password_required) {
        var password = window.prompt('请输入播放密码');
        if (password === null) return;
        return resolveEpisode(password).then(function (retry) {
          if (retry.code !== 0 || !retry.data || !retry.data.url) { alert(retry.msg || '播放权限验证失败'); return; }
          startPlay(Object.assign({}, ep, { url: retry.data.url }), from, parse, parse2, retry.data.trial_seconds || 0);
        });
      }
      if (resolved.code !== 0 || !resolved.data || !resolved.data.url) { alert(resolved.msg || '无法取得播放地址'); return; }
      startPlay(Object.assign({}, ep, { url: resolved.data.url }), from, parse, parse2, resolved.data.trial_seconds || 0);
    });
  });
}

function startPlay(ep, from, parse, parse2, trialSeconds, fallbackTried) {
  var saved = Interact.history.progress(vodId, sid, nid);
  var remote = serverProgress.find(function (item) { return Number(item.vod_id) === vodId && Number(item.play_sid) === sid && Number(item.play_nid) === nid; });
  if (remote && Number(remote.position_seconds) > saved) saved = Number(remote.position_seconds);
  lastProgressSync = 0;
  destroyPlayer();
  var triedLines=fallbackTried||new Set([sid]);
  triedLines.add(sid);fallbackInProgress=false;
  var generation=playerGeneration;

  var isHls = ep.url.indexOf('.m3u8') >= 0 || from.indexOf('m3u8') >= 0 || from === 'dplayer';
  var isMp4 = ep.url.indexOf('.mp4') >= 0;

  if ((parse && !isHls && !isMp4) || from === 'iframe') {
    if (trialSeconds > 0) {
      $('#dplayer').html('<div style="height:100%;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;text-align:center;padding:24px">此线路使用外部播放器，暂不支持试看计时，请切换内置播放线路或登录后观看。</div>');
      return;
    }
    var iframeSrc = parse ? parse + encodeURIComponent(ep.url) : ep.url;
    $('#dplayer').html(
      '<iframe id="playIframe" src="' + iframeSrc + '" width="100%" height="100%" frameborder="0" allowfullscreen="true" webkitallowfullscreen="true" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation" style="border:none;background:#000;"></iframe>'
    );
    return;
  }

  if (typeof DPlayer === 'undefined') {
    $('#dplayer').html('<video id="fallbackVideo" src="' + ep.url + '" controls autoplay style="width:100%;height:100%;background:#000;"></video>');
    applyPlaybackSpeed(Number(localStorage.getItem('maccms_playback_speed')||1));
    var fallbackVideo=document.getElementById('fallbackVideo');
    fallbackVideo.addEventListener('error',function(){if(playerGeneration===generation&&!trialFinished)tryNextPlaybackLine(ep,parse2,trialSeconds,triedLines,generation);});
    if (trialSeconds > 0) {
      startTrialEnforcement(trialSeconds);
    }
    return;
  }

  dp = new DPlayer({
    container: document.getElementById('dplayer'),
    autoplay: true,
    theme: '#0099ff',
    lang: 'zh-cn',
    screenshot: true,
    hotkey: true,
    preload: 'auto',
    volume: 0.8,
    video: {
      url: ep.url,
      type: isHls ? 'hls' : 'auto'
    }
  });
  applyPlaybackSpeed(Number(localStorage.getItem('maccms_playback_speed')||1));

  if (trialSeconds > 0) {
    startTrialEnforcement(trialSeconds);
  }

  if (saved > 5 && trialSeconds <= 0) {
    setTimeout(function () {
      try { dp.seek(saved); } catch (e) {}
    }, 1200);
  }

  dp.on('timeupdate', function () {
    var position = Math.floor(dp.video.currentTime);
    var duration = Math.floor(dp.video.duration || 0);
    Interact.history.save({
      vod_id: vodId, vod_name: vod.vod_name, vod_pic: vod.vod_pic,
      sid: sid, nid: nid, ep_name: ep.name, time: position, duration: duration
    });
    var now = Date.now();
    if (now - lastProgressSync >= 15000 || (duration > 0 && position >= duration - 10)) {
      lastProgressSync = now;
      API.post('/api/user/progress', { vod_id: vodId, sid: sid, nid: nid, episode_name: ep.name, position_seconds: position, duration_seconds: duration });
    }
  });

  // 同步服务端历史记录
  API.post('/api/user/history', { mid: 1, rid: vodId, sid: sid, nid: nid });

  dp.on('ended', function () { playNext(); });
  dp.on('error', function () {
    if(playerGeneration!==generation||trialFinished)return;
    tryNextPlaybackLine(ep,parse2,trialSeconds,triedLines,generation);
  });
}

function applyPlaybackSpeed(rate){
  rate=Number(rate)||1;
  var video=dp&&dp.video?dp.video:document.getElementById('fallbackVideo');
  if(video){try{video.playbackRate=rate;video.defaultPlaybackRate=rate;}catch(e){}}
}

function startTrialEnforcement(seconds){
  var storageKey='maccms_trial_until_'+activeTrialKey;
  if(!trialDeadline){var saved=Number(sessionStorage.getItem(storageKey)||0);trialDeadline=saved>0?saved:Date.now()+Math.max(1,Number(seconds)||1)*1000;sessionStorage.setItem(storageKey,String(trialDeadline));}
  if(trialTimer)clearInterval(trialTimer);
  var check=function(){var remain=Math.ceil((trialDeadline-Date.now())/1000);if(remain<=0){expireTrial();return;}$('#trialCountdown').text('试看剩余 '+Math.floor(remain/60)+':'+String(remain%60).padStart(2,'0'));};
  trialTimer=setInterval(check,250);check();
}

function expireTrial(){
  trialFinished=true;if(trialTimer)clearInterval(trialTimer);trialTimer=0;$('#trialCountdown').text('试看结束');
  try{if(dp)dp.pause();var fallback=document.getElementById('fallbackVideo');if(fallback)fallback.pause();}catch(e){}
  if(!document.getElementById('trialExpiredOverlay'))$('#dplayer').append('<div id="trialExpiredOverlay" style="position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.9);color:#fff;text-align:center;padding:24px"><strong>试看时间已结束</strong><a href="/user.html" style="margin-top:12px;padding:9px 22px;background:var(--hl-site,#09f);color:#fff;border-radius:20px;text-decoration:none">登录后继续观看</a></div>');
}

function tryNextPlaybackLine(ep,parse2,trialSeconds,tried,generation){
  if(fallbackInProgress)return;
  var groups=vod&&vod.play_groups||[];
  for(var nextSid=0;nextSid<groups.length;nextSid++){
    if(tried.has(nextSid)||!groups[nextSid].urls||!groups[nextSid].urls[nid])continue;
    tried.add(nextSid);fallbackInProgress=true;var nextNid=nid,group=groups[nextSid],from=(group.urls[nextNid].from||group.from||'dplayer').toLowerCase();
    var parse=playerCfg[from]||'',nextParse2=playerBackupCfg[from]||'';
    API.post('/api/vod/resolve',{vod_id:vodId,sid:nextSid,nid:nextNid,mode:'play'}).then(function(result){
      if(playerGeneration!==generation)return;
      if(result.code!==0||!result.data||!result.data.url){fallbackInProgress=false;tryNextPlaybackLine(ep,parse2,trialSeconds,tried,generation);return;}
      sid=nextSid;nid=nextNid;localStorage.setItem('maccms_last_play_line_'+vodId,String(sid));history.replaceState(null,'','/play.html?id='+vodId+'&sid='+sid+'&nid='+nid);renderSources();
      var selected=groups[nextSid].urls[nextNid];startPlay(Object.assign({},selected,{url:result.data.url}),from,parse,nextParse2,Math.max(Number(trialSeconds)||0,Number(result.data.trial_seconds)||0),tried);
    }).catch(function(){fallbackInProgress=false;if(playerGeneration===generation)tryNextPlaybackLine(ep,parse2,trialSeconds,tried,generation);});
    return;
  }
  if(parse2&&trialSeconds<=0&&!tried.has('parser2')){
    tried.add('parser2');var parserUrl=parse2+encodeURIComponent(ep.url);
    startPlay(Object.assign({},ep,{url:parserUrl}), 'iframe', '', '', 0, tried);
  }
}

function destroyPlayer() {
  playerGeneration++;
  if (dp) { try { dp.destroy(); } catch (e) {} dp = null; }
  $('#dplayer').html('');
}

function playNext() {
  var g = vod.play_groups[sid];
  if (g && nid < g.urls.length - 1) { nid++; renderSources(); playEpisode(); }
  else alert('已经是最后一集了');
}
function playPrev() {
  if (nid > 0) { nid--; renderSources(); playEpisode(); }
  else alert('已经是第一集了');
}

function loadComments() {
  API.get('/api/comment/list', { mid: 1, rid: vodId }).then(function (j) {
    var list = (j.code === 0 && j.data) ? j.data : [];
    $('#cmtCount').text(list.length);
    var box = $('#cmtList');
    if (!list.length) { box.html('<div class="hl-empty">还没有评论，快来抢沙发~</div>'); return; }
    box.html('');
    list.forEach(function (c) {
      box.append(
        '<div class="hl-comm-item" style="display:flex;gap:12px;margin-bottom:14px;border-bottom:1px solid var(--bd-color,#eee);padding-bottom:10px;">' +
        '<div class="hl-comm-avatar" style="width:36px;height:36px;border-radius:50%;background:var(--hl-site,#0099ff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;">' + U.esc((c.comment_name || '影').charAt(0)) + '</div>' +
        '<div style="flex:1;min-width:0"><div class="hl-comm-head" style="display:flex;justify-content:space-between;margin-bottom:4px;"><span class="hl-comm-name" style="font-weight:700;">' + U.esc(c.comment_name) + '</span>' +
        '<span class="hl-comm-time" style="font-size:.8rem;color:#888;">' + (c.comment_time ? new Date(c.comment_time * 1000).toLocaleString() : '') + '</span></div>' +
        '<div class="hl-comm-text" style="font-size:.9rem;line-height:1.5;">' + U.esc(c.comment_content) + '</div></div></div>'
      );
    });
  });
}

function submitComment() {
  var name = $('#cmtName').val().trim();
  var content = $('#cmtText').val().trim();
  if (!content) { alert('请输入评论内容'); return; }
  API.post('/api/comment/add', { mid: 1, rid: vodId, name: name, content: content }).then(function (j) {
    if (j.code === 0) { $('#cmtText').val(''); loadComments(); }
    else alert(j.msg || '发表失败');
  });
}
</script>
