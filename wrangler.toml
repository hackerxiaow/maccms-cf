name = "maccms-cf"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 静态前端资源目录绑定 (Cloudflare Workers Static Assets)
[assets]
directory = "./public"
binding = "ASSETS"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "maccms-db"
database_id = "local-maccms-db" # 生产环境部署时替换为 wrangler d1 create maccms-db 生成的真实 UUID
migrations_dir = "migrations"

# 定时调度入口 (每 5 分钟检查自动采集与后台任务计划)
[triggers]
crons = ["*/5 * * * *"]

# Create the bucket before deploying: wrangler r2 bucket create maccms-media
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "maccms-media"

# 环境变量
[vars]
SITE_NAME = "MacCMS 苹果影视"
SITE_URL = "https://example.com"
ADMIN_PASSWORD = "" # 留空时默认为 admin / admin888，可在后台系统配置中修改
