name = "maccms-cf-pages"
pages_build_output_dir = "./public"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "maccms-db"
database_id = "local-maccms-db" # Replace with the real ID from `wrangler d1 create maccms-db`.
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "maccms-media"

[vars]
SITE_NAME = "MacCMS 苹果影视"
SITE_URL = "https://example.com"
ADMIN_PASSWORD = ""
